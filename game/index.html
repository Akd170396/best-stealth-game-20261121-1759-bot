<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moonlit Post — a night courier stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0f1e;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
  }
  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
  canvas#game {
    display: block;
    width: 1280px;
    height: 720px;
    background: #10182e;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="src/boot.js"></script>
</body>
</html>
